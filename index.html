let planner = JSON.parse(localStorage.getItem('fpPlanner') || '[]');
let activePage = 'home';

const nav = document.getElementById('mainNav');

function savePlanner(){localStorage.setItem('fpPlanner', JSON.stringify(planner));}
function addPlanner(type, title, meta){ if(!planner.some(x=>x.type===type && x.title===title)){planner.push({type,title,meta,status:'Interested'}); savePlanner(); alert(`${title} added to planner.`);} else alert(`${title} is already in your planner.`); }
function pageHero(title, text, eyebrow='FuturePath SA'){return `<section class="page-hero"><div class="container"><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${text}</p></div></section>`}
function setPage(page){activePage=page; document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active',a.dataset.page===page)); nav.classList.remove('open'); const map={home, 'check-results':checkResults, industries, careers, courses, institutions, bursaries, planner:plannerPage, 'parent-mode':parentMode, offline}; app.innerHTML=map[page](); bindPage(page); window.scrollTo(0,0);}
function home(){return `<section class="hero"><div class="hero-inner"><div class="eyebrow">Offline-first guidance for South African learners</div><h1>Find your future path from your subjects, marks and interests.</h1><p>A simple guidance library for learners in villages, townships and under-resourced schools. Start clueless, then discover careers, courses, institutions and bursaries in one place.</p><div class="searchbar"><input id="homeSearch" placeholder="Search mining, nursing, engineering, bursaries, TVET..."/><button id="homeSearchBtn">Search</button></div><div class="hero-actions"><button class="btn dark" data-jump="check-results">Check my marks</button><button class="btn gold" data-jump="industries">Explore industries</button><button class="btn" data-jump="courses">Explore courses</button><button class="btn" data-jump="careers">Explore careers</button></div></div></section><section class="container"><div class="grid grid-4"><div class="card step-card"><span class="number">1</span><h3>Check my marks</h3><p>Enter subjects and marks to calculate a mock APS and see industries you may explore.</p></div><div class="card step-card"><span class="number">2</span><h3>Explore industries</h3><p>Start with mining, healthcare, technology, agriculture or logistics when you do not know job names yet.</p></div><div class="card step-card"><span class="number">3</span><h3>Explore courses</h3><p>Open a course to see requirements, possible jobs, institutions and bursaries linked to it.</p></div><div class="card step-card"><span class="number">4</span><h3>Find funding</h3><p>View bursary requirements, accepted institutions, funded courses and document checklists.</p></div></div><div class="mission mission-grid"><div><div class="eyebrow">The mission</div><h2>Help learners choose futures they were never exposed to.</h2><p>FuturePath SA connects school results to real study options, careers, industries, institutions and funding routes.</p></div><div class="question-grid"><div>What can I become?</div><div>What should I study?</div><div>Where can I study?</div><div>How can I fund it?</div></div></div><div class="section-title"><h2>Start from wherever you are</h2><p class="muted">For a learner who does not yet know the career name.</p></div><div class="grid grid-3"><div class="card"><h3>I know my marks</h3><p>Use Check Results to see matched industries and courses based on APS.</p><button class="btn dark" data-jump="check-results">Go to marks checker</button></div><div class="card"><h3>I know the industry</h3><p>Open an industry and discover jobs, daily routines, courses and institutions.</p><button class="btn dark" data-jump="industries">Go to industries</button></div><div class="card"><h3>I know the course</h3><p>Search a course and see what jobs it can lead to and which universities offer it.</p><button class="btn dark" data-jump="courses">Go to courses</button></div></div></section>`}
function checkResults(){return pageHero('APS calculator and course pathway checker','Manual marks entry works offline. OCR upload is shown as a future feature placeholder. Suggested results are grouped by industry so learners can open one industry at a time.')+`<section class="container"><div class="two-col"><div class="card"><h2>Enter marks</h2>${['English','Mathematics','Physical Sciences','Life Sciences / Geography','Accounting / CAT / Business','Life Orientation'].map((s,i)=>`<div class="input-group"><label>${s}</label><input class="mark-input" type="number" min="0" max="100" value="${[55,62,64,68,58,75][i]}"></div>`).join('')}<button class="btn dark" id="calcBtn">Calculate mock APS</button><div class="notice" style="margin-top:14px"><strong>OCR placeholder</strong><p>In the final app, learners can upload a matric statement and the system can extract subjects and marks automatically.</p><input type="file" disabled></div></div><div class="card"><h2>Your mock result</h2><div class="result-circle" id="apsCircle">0</div><p id="apsNote"></p><h3>Suggested industries based on your APS</h3><div id="industryMatches" class="list"></div></div></div></section>`}
function calculateAps(){const vals=[...document.querySelectorAll('.mark-input')].map(i=>Number(i.value)||0); const points=vals.map(v=>v>=80?7:v>=70?6:v>=60?5:v>=50?4:v>=40?3:v>=30?2:1); const aps=points.reduce((a,b)=>a+b,0); document.getElementById('apsCircle').textContent=aps; document.getElementById('apsNote').textContent= aps>=34?'Strong APS. You can explore competitive degree routes, but each institution still decides final admission.':aps>=28?'Good APS. Explore degree and diploma routes, and check subject-specific requirements.':'Consider diploma, TVET, bridging, learnership and foundation routes where available.'; const groups=data.industries.map(ind=>({ind,courses:data.courses.filter(c=>c.industry===ind.id && c.aps<=aps+4)})).filter(x=>x.courses.length); document.getElementById('industryMatches').innerHTML=groups.map(g=>`<div class="list-item pathway-card" data-open-industry-results="${g.ind.id}" data-aps="${aps}"><h3>${g.ind.name}</h3><p>${g.ind.summary}</p><span class="tag green">${g.courses.filter(c=>c.aps<=aps).length} courses within APS</span><span class="tag">${g.courses.filter(c=>c.aps>aps).length} close matches</span><p class="muted">Click to view all matching courses in this industry.</p></div>`).join('') || '<div class="empty">No matches yet. Try entering your marks.</div>';}
function industries(){return pageHero('Start with an industry, then discover the careers inside it','For learners who say: I want to work in mining, healthcare, technology, agriculture or logistics, but I do not know what jobs exist there.')+`<section class="container"><div class="tab-row">${data.industries.map((i,idx)=>`<button class="tab ${idx===0?'active':''}" data-industry-tab="${i.id}">${i.name}</button>`).join('')}</div><div id="industryView"></div></section>`}
function renderIndustry(id){const ind=data.industries.find(x=>x.id===id); const careers=data.careers.filter(c=>ind.careerIds.includes(c.id)); document.getElementById('industryView').innerHTML=`<div class="grid grid-2"><div class="card"><h2>${ind.name} pathway map</h2><p>${ind.summary}</p><p><strong>Common provinces:</strong> ${ind.provinces}</p><p><strong>Demand:</strong> ${ind.demand}</p><div class="grid grid-2">${ind.stages.map(s=>`<div class="info-box"><h4>${s.title}</h4><ul>${s.items.map(it=>`<li>${it}</li>`).join('')}</ul></div>`).join('')}</div></div><div class="card"><h2>Careers in ${ind.name}</h2><div class="filterbar" style="grid-template-columns:1fr"><select id="careerCategory"><option value="all">Show all role types</option>${[...new Set(careers.map(c=>c.category))].map(c=>`<option>${c}</option>`).join('')}</select></div><div id="industryCareers" class="list"></div></div></div>`; const draw=()=>{const cat=document.getElementById('careerCategory').value; const list=cat==='all'?careers:careers.filter(c=>c.category===cat); document.getElementById('industryCareers').innerHTML=list.map(c=>careerCard(c)).join('')}; document.getElementById('careerCategory').addEventListener('change',draw); draw();}
function careerCard(c){return `<div class="list-item" data-career="${c.id}"><h3>${c.title}</h3><p>${c.what}</p><span class="tag">${c.category}</span><span class="tag green">APS guide ${c.aps}+</span><span class="tag">${c.marks}</span><p class="muted">Click to view job details, daily routine, courses, institutions and bursaries.</p></div>`}
function careers(){return pageHero('Career Explorer','Open a career to understand what the job is, what a normal day looks like, required subjects, courses, institutions, bursaries and growth path.')+`<section class="container"><div class="filterbar"><input id="careerSearch" placeholder="Search career name or subject"><select id="careerIndustry"><option value="all">All industries</option>${data.industries.map(i=>`<option value="${i.id}">${i.name}</option>`).join('')}</select><select id="careerSubject"><option value="all">Any subject</option><option>Mathematics</option><option>Physical Sciences</option><option>Life Sciences</option><option>CAT</option></select><button class="btn dark" id="careerFilter">Filter</button></div><div id="careerList" class="grid grid-3"></div></section>`}
function renderCareers(){const q=(document.getElementById('careerSearch')?.value||'').toLowerCase(); const ind=document.getElementById('careerIndustry')?.value||'all'; const sub=document.getElementById('careerSubject')?.value||'all'; let list=data.careers.filter(c=>(ind==='all'||c.industry===ind) && (sub==='all'||c.subjects.includes(sub)) && (`${c.title} ${c.what} ${c.subjects}`.toLowerCase().includes(q))); document.getElementById('careerList').innerHTML=list.map(c=>`<div class="card list-item" data-career="${c.id}"><h3>${c.title}</h3><p>${c.what}</p><span class="tag">${data.industries.find(i=>i.id===c.industry)?.name}</span><span class="tag green">APS ${c.aps}+</span><p class="muted">Open full career guide.</p></div>`).join('') || '<div class="empty">No careers found.</div>';}
function courses(){return pageHero('Course Finder','Search courses and open each course to see requirements, what jobs it can lead to, which institutions offer it and which bursaries may fund it.')+`<section class="container"><div class="filterbar"><input id="courseSearch" placeholder="Search course, job, institution"><select id="courseIndustry"><option value="all">All industries</option>${data.industries.map(i=>`<option value="${i.id}">${i.name}</option>`).join('')}</select><select id="courseRoute"><option value="all">Any route</option><option>University</option><option>University of Technology</option><option>TVET</option></select><button class="btn dark" id="courseFilter">Filter</button></div><div id="courseList" class="grid grid-3"></div></section>`}
function renderCourses(){const q=(document.getElementById('courseSearch')?.value||'').toLowerCase(); const ind=document.getElementById('courseIndustry')?.value||'all'; const route=document.getElementById('courseRoute')?.value||'all'; let list=data.courses.filter(c=>(ind==='all'||c.industry===ind) && (route==='all'||c.route.includes(route)) && (`${c.name} ${c.description} ${c.jobs.join(' ')} ${c.institutions.join(' ')}`.toLowerCase().includes(q))); document.getElementById('courseList').innerHTML=list.map(courseCard).join('') || '<div class="empty">No courses found.</div>';}
function courseCard(c){return `<div class="card list-item" data-course="${c.id}"><h3>${c.name}</h3><p>${c.description}</p><span class="tag green">APS guide ${c.aps}+</span><span class="tag">${c.level}</span><p><strong>Can lead to:</strong> ${c.jobs.join(', ')}</p><p class="muted">Click for requirements, institutions and bursaries.</p></div>`}
function institutions(){return pageHero('Institution Finder','Click an institution to view location, type, courses offered, application notes, funding options, website link and prospectus link.')+`<section class="container"><div class="filterbar"><input id="instSearch" placeholder="Search institution, province or course"><select id="instProvince"><option value="all">All provinces</option>${[...new Set(data.institutions.map(i=>i.province))].map(p=>`<option>${p}</option>`).join('')}</select><select id="instType"><option value="all">All types</option>${[...new Set(data.institutions.map(i=>i.type))].map(t=>`<option>${t}</option>`).join('')}</select><button class="btn dark" id="instFilter">Filter</button></div><div id="instList" class="grid grid-3"></div></section>`}
function renderInstitutions(){const q=(document.getElementById('instSearch')?.value||'').toLowerCase(); const p=document.getElementById('instProvince')?.value||'all'; const t=document.getElementById('instType')?.value||'all'; const list=data.institutions.filter(i=>(p==='all'||i.province===p)&&(t==='all'||i.type===t)&&(`${i.name} ${i.province} ${i.location} ${i.courses.join(' ')}`.toLowerCase().includes(q))); document.getElementById('instList').innerHTML=list.map(i=>`<div class="card list-item" data-institution="${i.id}"><h3>${i.name}</h3><p>${i.description}</p><span class="tag">${i.type}</span><span class="tag green">${i.province}</span><p class="muted">Click for campus, prospectus, courses and funding.</p></div>`).join('') || '<div class="empty">No institutions found.</div>';}
function bursaries(){return pageHero('Bursary and Funding Matcher','Open each bursary to see what it covers, funded courses, accepted institutions, requirements, documents, deadline notes and official link.')+`<section class="container"><div class="filterbar"><input id="bursarySearch" placeholder="Search bursary, course or provider"><select id="bursaryIndustry"><option value="all">All industries</option>${data.industries.map(i=>`<option>${i.name}</option>`).join('')}</select><select id="bursaryType"><option value="all">All funding types</option>${[...new Set(data.bursaries.map(b=>b.type))].map(t=>`<option>${t}</option>`).join('')}</select><button class="btn dark" id="bursaryFilter">Filter</button></div><div id="bursaryList" class="grid grid-3"></div></section>`}
function renderBursaries(){const q=(document.getElementById('bursarySearch')?.value||'').toLowerCase(); const ind=document.getElementById('bursaryIndustry')?.value||'all'; const type=document.getElementById('bursaryType')?.value||'all'; const list=data.bursaries.filter(b=>(ind==='all'||b.industries.includes(ind)||b.industries.includes('All'))&&(type==='all'||b.type===type)&&(`${b.name} ${b.provider} ${b.courses.join(' ')} ${b.institutions.join(' ')}`.toLowerCase().includes(q))); document.getElementById('bursaryList').innerHTML=list.map(b=>`<div class="card list-item" data-bursary="${b.id}"><h3>${b.name}</h3><p><strong>${b.provider}</strong></p><p>${b.covers}</p><span class="tag">${b.type}</span><span class="tag green">${b.deadline}</span><p class="muted">Click for requirements and documents.</p></div>`).join('') || '<div class="empty">No bursaries found.</div>';}
function plannerPage(){return pageHero('Application Planner','Save courses, institutions and bursaries here, then track documents and status. This helps learners not forget deadlines or missing documents.')+`<section class="container"><div class="section-title"><h2>My saved plan</h2><button class="btn" id="clearPlanner">Clear mock planner</button></div><div id="plannerList" class="list">${planner.length?planner.map((p,i)=>`<div class="planner-row"><span class="tag">${p.type}</span><div><strong>${p.title}</strong><p class="muted">${p.meta||'Saved item'}</p><span class="status">${p.status}</span></div><button class="btn small" data-remove-plan="${i}">Remove</button></div>`).join(''):'<div class="empty">Nothing saved yet. Open a course, institution or bursary and add it to the planner.</div>'}</div><div class="card" style="margin-top:24px"><h2>Document checklist</h2><div class="grid grid-3">${['Certified ID copy','Latest results','Parent/guardian ID copies','Proof of income or affidavit','Proof of residence','Motivational letter','CV','Acceptance letter','Academic transcript'].map(x=>`<label class="info-box"><input type="checkbox"> ${x}</label>`).join('')}</div></div></section>`}

function openModal(html){modalContent.innerHTML=html; modal.classList.remove('hidden');}
function closeModal(){modal.classList.add('hidden');}
function careerDetails(id){const c=data.careers.find(x=>x.id===id); return `<div class="modal-head"><div class="eyebrow">Career guide</div><h2>${c.title}</h2><p>${c.what}</p></div><div class="modal-body"><div class="details-layout"><div><h3>What does this job do?</h3><p>${c.what}</p><h3>Daily routine</h3><p>${c.routine}</p><h3>Subjects and marks guide</h3><p><strong>Subjects:</strong> ${c.subjects}</p><p><strong>Marks guide:</strong> ${c.marks}</p><p><strong>APS guide:</strong> ${c.aps}+</p><h3>Skills needed</h3>${c.skills.map(s=>`<span class="tag">${s}</span>`).join('')}</div><div><div class="info-box"><h4>Courses that can lead here</h4>${c.courses.map(name=>`<div class="course-mini"><span>${name}</span><button class="btn small" data-course-name="${name}">View</button></div>`).join('')}</div><div class="info-box"><h4>Institutions to explore</h4><ul>${c.institutions.map(i=>`<li>${i}</li>`).join('')}</ul></div><div class="info-box"><h4>Bursaries / funding</h4><ul>${c.bursaries.map(b=>`<li>${b}</li>`).join('')}</ul></div><div class="link-row"><button class="btn gold" onclick="addPlanner('Career','${c.title.replaceAll("'","\\'")}','${c.industry} career')">Add career to planner</button><button class="btn" data-jump="parent-mode">Explain to parent</button></div></div></div></div>`}
function courseDetails(id){const c=data.courses.find(x=>x.id===id); const relatedCareers=data.careers.filter(cr=>c.jobs.includes(cr.title)); return `<div class="modal-head"><div class="eyebrow">Course guide</div><h2>${c.name}</h2><p>${c.description}</p></div><div class="modal-body"><div class="details-layout"><div><h3>Admission guide</h3><p><strong>APS guide:</strong> ${c.aps}+</p><p><strong>Subjects:</strong> ${c.subjects}</p><p><strong>Route:</strong> ${c.route}</p><p class="notice">Meeting minimum requirements does not guarantee admission. Always confirm with the institution.</p><h3>Jobs available after this course</h3><div class="list">${relatedCareers.length?relatedCareers.map(cr=>`<div class="list-item" data-career="${cr.id}"><strong>${cr.title}</strong><p>${cr.what}</p></div>`).join(''):c.jobs.map(j=>`<div class="info-box">${j}</div>`).join('')}</div></div><div><div class="info-box"><h4>Institutions offering this course</h4>${c.institutions.map(i=>`<div class="course-mini"><span>${i}</span><button class="btn small" data-inst-name="${i}">View</button></div>`).join('')}</div><div class="info-box"><h4>Bursaries linked to this course</h4>${c.bursaries.map(b=>`<div class="course-mini"><span>${b}</span><button class="btn small" data-bursary-name="${b}">View</button></div>`).join('')}</div><button class="btn gold" onclick="addPlanner('Course','${c.name.replaceAll("'","\\'")}','APS ${c.aps}+ • ${c.level}')">Save course</button></div></div></div>`}
function institutionDetails(id){const i=data.institutions.find(x=>x.id===id); return `<div class="modal-head"><div class="eyebrow">Institution profile</div><h2>${i.name}</h2><p>${i.description}</p></div><div class="modal-body"><div class="details-layout"><div><h3>Location and type</h3><p><strong>Type:</strong> ${i.type}</p><p><strong>Province:</strong> ${i.province}</p><p><strong>Location:</strong> ${i.location}</p><h3>Courses offered in this mock data</h3><div class="list">${i.courses.map(c=>`<div class="course-mini"><span>${c}</span><button class="btn small" data-course-name="${c}">View course</button></div>`).join('')}</div></div><div><div class="info-box"><h4>Application notes</h4><p>${i.applications}</p></div><div class="info-box"><h4>Funding notes</h4><p>${i.funding}</p></div><div class="link-row"><a class="btn dark" href="${i.website}" target="_blank">Visit website</a><a class="btn" href="#" onclick="alert('Mock prospectus link. In the real app this will download or open the official prospectus.');return false;">Download prospectus</a><button class="btn gold" onclick="addPlanner('Institution','${i.name.replaceAll("'","\\'")}','${i.location}')">Save institution</button></div></div></div></div>`}
function bursaryDetails(id){const b=data.bursaries.find(x=>x.id===id); return `<div class="modal-head"><div class="eyebrow">Funding guide</div><h2>${b.name}</h2><p>${b.provider} • ${b.type}</p></div><div class="modal-body"><div class="details-layout"><div><h3>What it covers</h3><p>${b.covers}</p><h3>Requirements</h3><p>${b.requirements}</p><h3>Document checklist</h3><ul>${b.documents.map(d=>`<li>${d}</li>`).join('')}</ul><p class="notice"><strong>Deadline:</strong> ${b.deadline}. Always confirm latest information with the official provider.</p></div><div><div class="info-box"><h4>Funded courses</h4><ul>${b.courses.map(c=>`<li>${c}</li>`).join('')}</ul></div><div class="info-box"><h4>Accepted institutions</h4><ul>${b.institutions.map(i=>`<li>${i}</li>`).join('')}</ul></div><div class="link-row"><a class="btn dark" href="${b.link}" target="_blank">Official link</a><button class="btn gold" onclick="addPlanner('Bursary','${b.name.replaceAll("'","\\'")}','${b.deadline}')">Save bursary</button></div></div></div></div>`}
function industryResultDetails(id,aps){const ind=data.industries.find(x=>x.id===id); const all=data.courses.filter(c=>c.industry===id).sort((a,b)=>a.aps-b.aps); return `<div class="modal-head"><div class="eyebrow">Matched industry</div><h2>${ind.name}</h2><p>Your mock APS is ${aps}. Below are courses in this industry. Some are within your APS, others are close matches that may need improvement, bridging or different institution rules.</p></div><div class="modal-body"><div class="list">${all.map(c=>`<div class="list-item" data-course="${c.id}"><h3>${c.name}</h3><p>${c.description}</p><span class="tag ${c.aps<=aps?'green':'red'}">${c.aps<=aps?'Within APS guide':'Close / above APS guide'}: ${c.aps}+</span><span class="tag">${c.route}</span><p><strong>Jobs:</strong> ${c.jobs.join(', ')}</p></div>`).join('')}</div></div>`}
function bindPage(page){document.querySelectorAll('[data-jump]').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.jump))); if(page==='check-results'){document.getElementById('calcBtn').addEventListener('click',calculateAps); calculateAps();} if(page==='industries'){renderIndustry('mining'); document.querySelectorAll('[data-industry-tab]').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('[data-industry-tab]').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); renderIndustry(btn.dataset.industryTab);}));} if(page==='careers'){renderCareers(); document.getElementById('careerFilter').addEventListener('click',renderCareers); document.getElementById('careerSearch').addEventListener('input',renderCareers);} if(page==='courses'){renderCourses(); document.getElementById('courseFilter').addEventListener('click',renderCourses); document.getElementById('courseSearch').addEventListener('input',renderCourses);} if(page==='institutions'){renderInstitutions(); document.getElementById('instFilter').addEventListener('click',renderInstitutions); document.getElementById('instSearch').addEventListener('input',renderInstitutions);} if(page==='bursaries'){renderBursaries(); document.getElementById('bursaryFilter').addEventListener('click',renderBursaries); document.getElementById('bursarySearch').addEventListener('input',renderBursaries);} if(page==='planner'){document.querySelectorAll('[data-remove-plan]').forEach(btn=>btn.addEventListener('click',()=>{planner.splice(Number(btn.dataset.removePlan),1);savePlanner();setPage('planner')})); document.getElementById('clearPlanner').addEventListener('click',()=>{planner=[];savePlanner();setPage('planner')});} if(page==='parent-mode'){document.getElementById('parentExplain').addEventListener('click',()=>{const val=document.getElementById('parentTopic').value; const item=data.careers.find(x=>x.id===val)||data.courses.find(x=>x.id===val)||data.bursaries.find(x=>x.id===val); let text=''; if(item.title) text=`${item.title} is a real career path. In simple terms: ${item.what} This path can connect to courses such as ${item.courses?.join(', ')} and may be useful in South African industries like ${data.industries.find(i=>i.id===item.industry)?.name || 'several sectors'}.`; else if(item.name && item.aps) text=`${item.name} is a study route. It can lead to jobs such as ${item.jobs.join(', ')}. Learners should check APS and subject requirements before applying.`; else text=`${item.name} is a funding option. It may help pay for studies, but the learner must check requirements, documents and official deadlines.`; document.getElementById('parentOutput').innerHTML=`<p>${text}</p>`;});}}
document.addEventListener('click',e=>{const c=e.target.closest('[data-career]'); if(c) openModal(careerDetails(c.dataset.career)); const co=e.target.closest('[data-course]'); if(co) openModal(courseDetails(co.dataset.course)); const inst=e.target.closest('[data-institution]'); if(inst) openModal(institutionDetails(inst.dataset.institution)); const bur=e.target.closest('[data-bursary]'); if(bur) openModal(bursaryDetails(bur.dataset.bursary)); const ir=e.target.closest('[data-open-industry-results]'); if(ir) openModal(industryResultDetails(ir.dataset.openIndustryResults,Number(ir.dataset.aps))); const cn=e.target.closest('[data-course-name]'); if(cn){const found=data.courses.find(x=>x.name===cn.dataset.courseName || x.name.includes(cn.dataset.courseName)); if(found) openModal(courseDetails(found.id));} const inn=e.target.closest('[data-inst-name]'); if(inn){const found=data.institutions.find(x=>x.name===inn.dataset.instName); if(found) openModal(institutionDetails(found.id));} const bn=e.target.closest('[data-bursary-name]'); if(bn){const found=data.bursaries.find(x=>x.name===bn.dataset.bursaryName); if(found) openModal(bursaryDetails(found.id));}});
document.querySelectorAll('nav a,.brand').forEach(a=>a.addEventListener('click',e=>{e.preventDefault(); setPage(a.dataset.page)}));
document.getElementById('menuToggle').addEventListener('click',()=>nav.classList.toggle('open'));
document.getElementById('modalClose').addEventListener('click',closeModal); modal.addEventListener('click',e=>{if(e.target===modal) closeModal()});
window.addEventListener('hashchange',()=>{const p=location.hash.replace('#','')||'home'; setPage(p)}); setPage(location.hash.replace('#','')||'home');

</script>
</body>
</html>
